ros-jazzy-xacro = "*"
ros-jazzy-yaml-cpp-vendor = "*"

# Pinocchio from conda-forge, since RoboStack does not build it for win-64
pinocchio = ">=4.1.0,<5"

# RoboStack only builds mujoco_ros2_control for Linux
[feature.jazzy.target.linux.dependencies]
ros-jazzy-mujoco-ros2-control = "*"

[feature.jazzy.activation.env]
ROS_DISTRO = "jazzy"

# Adds conda-forge's prebuilt roboplan core on top of a ROS-distro
# feature above, instead of cloning/building roboplan from source in the
# same environment. Must be used with the conda feature above.
[feature.conda-roboplan.dependencies]
roboplan-python = "*"
roboplan-simple-ik-python = "*"
roboplan-oink-python = "*"

# Must match the nanobind-abi generation roboplan-python (conda-forge) was
# built against!
# TODO: drop once roboplan-feedstock exports this transitively.
nanobind-abi = "==20"

[feature.conda-roboplan.tasks]
setup = { cmd = """
colcon mixin add default https://raw.githubusercontent.com/colcon/colcon-mixin-repository/master/index.yaml || true && \
colcon mixin update default
""" }
build = { cmd = ["colcon", "build", "--cmake-args", "-DROBOPLAN_ROS_STABLE_ABI=ON"] }
build-symlink = { cmd = ["colcon", "build", "--symlink-install", "--cmake-args", "-DROBOPLAN_ROS_STABLE_ABI=ON"] }

[feature.conda-roboplan.target.win.tasks]
build = { cmd = [
  "colcon", "build", "--cmake-args",
  "-GNinja",
  "-DCMAKE_C_COMPILER=clang-cl",
  "-DCMAKE_CXX_COMPILER=clang-cl",
  "-DCMAKE_LINKER=lld-link",
  "-DPython3_EXECUTABLE=$CONDA_PREFIX/python.exe",  # conda envs ship no python3.exe on Windows
  "-DROBOPLAN_ROS_STABLE_ABI=ON",
] }
