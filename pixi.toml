[workspace]
authors = [
    "Erik Holum <eholum@gmail.com>",
    "Sebastian Castro <sebas.a.castro@gmail.com>"
]
channels = ["conda-forge"]
name = "roboplan-ros"
platforms = [
    "linux-64",
    "linux-aarch64",
    # RoboStack osx-arm64 builds require macOS 14+
    { platform = "osx-arm64", macos = "14.0" },
    "win-64",
]
version = "0.8.0"

[tasks]
# Clones the matching RoboPlan release (if the folder does not exist) and sets up colcon mixins.
setup = { cmd = """
git clone https://github.com/open-planning/roboplan.git || true && \
git -C roboplan checkout "$(cat ROBOPLAN_VERSION)" && \
colcon mixin add default https://raw.githubusercontent.com/colcon/colcon-mixin-repository/master/index.yaml || true && \
colcon mixin update default
""" }
build = { cmd = ["colcon", "build", "--cmake-args", "-DROBOPLAN_ROS_STABLE_ABI=$ROBOPLAN_ROS_STABLE_ABI"] }
build-symlink = { cmd = ["colcon", "build", "--symlink-install", "--cmake-args", "-DROBOPLAN_ROS_STABLE_ABI=$ROBOPLAN_ROS_STABLE_ABI"] }
test = { cmd = ["colcon", "test"] }
test-result = { cmd = ["colcon", "test-result", "--verbose"] }
clean = { cmd = "rm -rf build install log" }

# Use the MSVC-compatible clang driver: conda-forge packages are built with
# MSVC and export MSVC-style flags that the GNU-style clang++ driver rejects.
[target.win.tasks]
build = { cmd = [
  "colcon", "build", "--cmake-args",
  "-GNinja",
  "-DCMAKE_C_COMPILER=clang-cl",
  "-DCMAKE_CXX_COMPILER=clang-cl",
  "-DCMAKE_LINKER=lld-link",
  "-DPython3_EXECUTABLE=$CONDA_PREFIX/python.exe",  # conda envs ship no python3.exe on Windows
  "-DROBOPLAN_ROS_STABLE_ABI=$ROBOPLAN_ROS_STABLE_ABI",
] }
build-symlink = { cmd = [
  "colcon", "build", "--symlink-install", "--cmake-args",
  "-GNinja",
  "-DCMAKE_C_COMPILER=clang-cl",
  "-DCMAKE_CXX_COMPILER=clang-cl",
  "-DCMAKE_LINKER=lld-link",
  "-DPython3_EXECUTABLE=$CONDA_PREFIX/python.exe",  # conda envs ship no python3.exe on Windows
  "-DROBOPLAN_ROS_STABLE_ABI=$ROBOPLAN_ROS_STABLE_ABI",
] }

[dependencies]
# Build deps
colcon-common-extensions = ">=0.3.0,<0.4"
colcon-mixin = ">=0.2.3,<0.3"
cmake = ">=3.30.5,<4"
clangxx = ">=19.1.7,<20"
lld = ">=19.1.2,<20"
ninja = ">=1.13.1,<2"
sccache = ">=0.16.0,<0.17"

# Common roboplan base deps
python = ">=3.11,<3.15"
gtest = ">=1.17.0,<2"
filelock = ">=3.20.0,<4"
matplotlib = ">=3.10.6,<4"
nodeenv = ">=1.10.0,<2"
numpy = ">=1.26.4,<3"
nanobind = ">=3.1.0,<4"
nanoflann = ">=2.0.1,<3"
plyfile = ">=1.1,<2"
pycollada = ">=0.9.2, <0.10"
tyro = ">=0.9.32,<0.10"
viser = ">=1.0.29,<2.0"  # See https://github.com/viser-project/viser/issues/719

# This fails with colcon test on newer pytest versions
# due to failures loading ROS launch testing plugins.
pytest = "<9.1.0"

[target.linux.dependencies]
mold = ">=2.40.2,<3"
# For ROS tracing, Linux-only
lttng-ust = ">=2.13.9,<3"

[target.win.dependencies]
# Needed to lookup example model resources on non-POSIX platforms.
dlfcn-win32 = ">=1.4.2,<2"
# The MSVC STL on current GitHub Windows runners (Visual Studio 2026) requires
# clang >= 20, so use a newer LLVM toolchain than on Linux.
clangxx = ">=22.1.8,<23"
compiler-rt = ">=22.1.8,<23"
lld = ">=22.1.8,<23"
llvm-tools = ">=22.1.8,<23"

[pypi-dependencies]
obj2mjcf = ">=0.0.25, <0.0.26"
robot_descriptions = ">=1.12,<2"

[activation]
scripts = ["install/setup.sh"]

[activation.env]
# Build nanobind extensions with the stable Python ABI. Must be ON when using
# prebuilt roboplan core from conda-forge/RoboStack (see the conda-roboplan feature).
ROBOPLAN_ROS_STABLE_ABI = "OFF"

[target.unix.activation.env]
# Prioritize pixi installed packages
CMAKE_PREFIX_PATH = "${CONDA_PREFIX}:${CMAKE_PREFIX_PATH}"
# Ensures the linker knows where to look for conda managed packages
LIBRARY_PATH = "${CONDA_PREFIX}/lib:${LIBRARY_PATH}"
LD_LIBRARY_PATH = "${CONDA_PREFIX}/lib:${LD_LIBRARY_PATH}"
LDFLAGS = "-L${CONDA_PREFIX}/lib -Wl,-rpath,${CONDA_PREFIX}/lib"

# On Linux, we want to use the mold linker. Rather than a special-case colcon mixin,
# we just append to the CXXFLAGS so it's additive over what is in colcon_defaults.yaml.
[target.linux.activation.env]
CXXFLAGS = "-fuse-ld=mold"

# Windows activation scripts expand %VAR% instead of $VAR.
[target.win.activation]
scripts = ['install\setup.bat']

[target.win.activation.env]
# Prioritize pixi installed packages, which live under Library on Windows
CMAKE_PREFIX_PATH = '%CONDA_PREFIX%\Library;%CMAKE_PREFIX_PATH%'

# Define one environment per ROS 2 distro.
[environments]
# The distro feature comes first so its RoboStack channel takes priority over
# conda-forge (features without channels inherit the workspace channels).
rolling = { features = ["rolling", "ros2"] }
lyrical = { features = ["lyrical", "ros2"] }
kilted = { features = ["kilted", "ros2"] }
jazzy = { features = ["jazzy", "ros2"] }

# Same as above, but building against prebuilt RoboPlan core from conda-forge.
rolling-conda-roboplan = { features = ["rolling", "ros2", "conda-roboplan"] }
lyrical-conda-roboplan = { features = ["lyrical", "ros2", "conda-roboplan"] }
kilted-conda-roboplan = { features = ["kilted", "ros2", "conda-roboplan"] }
jazzy-conda-roboplan = { features = ["jazzy", "ros2", "conda-roboplan"] }

################################
## Shared ROS 2 dependencies  ##
################################
# RoboStack publishes distro-agnostic `ros2-*` package names; the distro is
# selected by the channel each distro feature adds.
[feature.ros2.dependencies]
ros2-ros-base = "*"

# RoboPlan and RoboPlan ROS dependencies
ros2-builtin-interfaces = "*"
ros2-console-bridge-vendor = "*"
ros2-controller-manager = "*"
ros2-geometry-msgs = "*"
ros2-interactive-markers = "*"
ros2-joint-state-broadcaster = "*"
ros2-joint-trajectory-controller = "*"
ros2-parallel-gripper-controller = "*"
ros2-pinocchio = "*"
ros2-proxsuite = "*"
ros2-robot-state-publisher = "*"
ros2-ros2controlcli = "*"
ros2-rviz2 = "*"
ros2-sensor-msgs = "*"
ros2-tf2-eigen = "*"
ros2-toppra = "*"
ros2-topic-tools = "*"
ros2-trajectory-msgs = "*"
ros2-urdfdom = "*"
ros2-visualization-msgs = "*"
ros2-xacro = "*"
ros2-yaml-cpp-vendor = "*"

# RoboStack only builds mujoco_ros2_control for Linux
[feature.ros2.target.linux.dependencies]
ros2-mujoco-ros2-control = "*"

###################
## ROS 2 Rolling ##
###################
[feature.rolling]
channels = ["https://prefix.dev/robostack-rolling"]

[feature.rolling.dependencies]
# roboplan_core uses plain tinyxml2 (not the vendor package) on this distro
tinyxml2 = "*"

[feature.rolling.activation.env]
ROS_DISTRO = "rolling"

###################
## ROS 2 Lyrical ##
###################
[feature.lyrical]
channels = ["https://prefix.dev/robostack-lyrical"]

[feature.lyrical.dependencies]
# roboplan_core uses plain tinyxml2 (not the vendor package) on this distro
tinyxml2 = "*"

[feature.lyrical.activation.env]
ROS_DISTRO = "lyrical"

##################
## ROS 2 Kilted ##
##################
[feature.kilted]
channels = ["https://prefix.dev/robostack-kilted"]

[feature.kilted.dependencies]
ros2-tinyxml2-vendor = "*"
ros2-tl-expected = "*"

[feature.kilted.activation.env]
ROS_DISTRO = "kilted"

#################
## ROS 2 Jazzy ##
#################
[feature.jazzy]
channels = ["https://prefix.dev/robostack-jazzy"]

[feature.jazzy.dependencies]
ros2-tinyxml2-vendor = "*"
ros2-tl-expected = "*"

[feature.jazzy.activation.env]
ROS_DISTRO = "jazzy"

#######################
## Prebuilt RoboPlan ##
#######################
# Builds against a prebuilt roboplan core from conda-forge instead of
# cloning/building roboplan from source in the same environment.
[feature.conda-roboplan.dependencies]
roboplan-python = ">=0.8.0,<0.9.0"

[feature.conda-roboplan.activation.env]
ROBOPLAN_ROS_STABLE_ABI = "ON"

[feature.conda-roboplan.tasks]
setup = { cmd = """
colcon mixin add default https://raw.githubusercontent.com/colcon/colcon-mixin-repository/master/index.yaml || true && \
colcon mixin update default
""" }
